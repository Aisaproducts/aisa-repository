<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 10px; border: 1px solid #ccc; }
        .checkout-form { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Shopping Cart</h1>
    <table id="cart">
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sample Item 1</td>
                <td>
                    <input type="number" value="1" min="1" onchange="updateTotal()" />
                </td>
                <td>$10.00</td>
                <td class="item-total">$10.00</td>
            </tr>
            <tr>
                <td>Sample Item 2</td>
                <td>
                    <input type="number" value="1" min="1" onchange="updateTotal()" />
                </td>
                <td>$15.00</td>
                <td class="item-total">$15.00</td>
            </tr>
        </tbody>
    </table>
    <h2 id="grand-total">Grand Total: $25.00</h2>
    <h3>Payment Options</h3>
    <form class="checkout-form">
        <label for="payment-method">Choose a payment method:</label><br>
        <select id="payment-method" onchange="updatePaymentOptions()">
            <option value="cash">Cash</option>
            <option value="credit-card">Credit/Debit Card</option>
            <option value="bank-transfer">Bank Transfer</option>
        </select>
        <div id="payment-details"></div>
        <label for="billing-name">Name:</label>
        <input type="text" id="billing-name" required /><br />
        <label for="billing-address">Address:</label>
        <input type="text" id="billing-address" required /><br />
        <button type="submit">Checkout</button>
    </form>
    <script>
        function updateTotal() {
            let total = 0;
            document.querySelectorAll('#cart tbody tr').forEach(row => {
                const price = parseFloat(row.cells[2].innerText.replace('$', ''));
                const quantity = row.querySelector('input[type="number"]').value;
                const itemTotal = price * quantity;
                row.querySelector('.item-total').innerText = `$${itemTotal.toFixed(2)}`;
                total += itemTotal;
            });
            document.getElementById('grand-total').innerText = `Grand Total: $${total.toFixed(2)}`;
        }
        function updatePaymentOptions() {
            const method = document.getElementById('payment-method').value;
            const detailsDiv = document.getElementById('payment-details');
            detailsDiv.innerHTML = method === 'credit-card' ? '<label for="card-number">Card Number:</label><input type="text" id="card-number" required /><br />' : '';
        }
    </script>
</body>
</html>
